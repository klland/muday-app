<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>一沐日點餐</title>
  <link rel="stylesheet" href="style.css?v=16" />
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <div class="logo-text-wrap">
          <span class="logo-text">一沐日</span>
          <span class="logo-sub-line"><span class="logo-rule">——</span><span class="logo-menu-en">TEA MENU · NO. 04</span></span>
          <span class="logo-sub" id="lineUserName"></span>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="historyBtn" title="歷史訂單">史</button>
        <button class="icon-btn" id="groupBtn" title="今日團購">眾<span class="group-badge" id="groupBadge" style="display:none">0</span></button>
        <button class="cart-btn" id="cartBtn">
          籃
          <span class="cart-badge" id="cartBadge">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主頁 -->
  <main class="main">
    <nav class="category-nav" id="categoryNav"></nav>
    <section class="menu-section" id="menuSection"></section>
  </main>

  <!-- 底部 Sticky 結帳列 -->
  <div class="sticky-bar" id="stickyBar">
    <div class="sticky-icon" id="stickyCartIcon">
      篩
      <span class="sticky-icon-badge" id="stickyBadge">0</span>
    </div>
    <div class="sticky-info">
      <div class="sticky-cups" id="stickyCups">0 杯</div>
      <div class="sticky-total"><span class="nt">NT$</span><span id="stickyTotal">0</span></div>
    </div>
    <button class="sticky-checkout" id="stickyCheckout">結帳</button>
  </div>

  <!-- 購物車側板 -->
  <aside class="cart-panel" id="cartPanel">
    <div class="cart-header">
      <div class="cart-header-text">
        <div class="cart-header-en">· your basket ·</div>
        <h2>茶籃 <span class="cart-header-count" id="cartHeaderCount">· 0 items</span></h2>
      </div>
      <button class="close-btn" id="closeCart">✕</button>
    </div>

    <div class="name-row" id="nameRow">
      <label for="nameInput">姓名</label>
      <input type="text" id="nameInput" placeholder="輸入名字，方便對單" maxlength="10" />
    </div>

    <div class="cart-body" id="cartBody">
      <p class="cart-empty">購物車是空的</p>
    </div>
    <div class="cart-footer" id="cartFooter" style="display:none">
      <div class="cart-total">
        <div class="cart-total-label-wrap">
          <span class="cart-total-zh">合計</span>
          <span class="cart-total-sub">· subtotal</span>
        </div>
        <span id="cartTotal">0</span>
      </div>
      <button class="checkout-btn" id="checkoutBtn">
        <span class="checkout-en">— place order —</span>
        <span class="checkout-zh">送出訂單</span>
        <span class="checkout-arrow">→</span>
      </button>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>

  <!-- 客製化 Modal -->
  <div class="modal" id="customModal">
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <h3 id="modalTitle"></h3>
          <div class="modal-tags" id="modalTags"></div>
        </div>
        <button class="close-btn" id="closeModal">✕</button>
      </div>
      <div class="modal-body">
        <p id="modalPrice" class="modal-price"></p>
        <div class="fixed-note" id="fixedNote" style="display:none">此飲品甜度與冰量固定，不可調整</div>
        <div class="option-group" id="sugarGroup">
          <label>甜度</label>
          <div class="option-row" id="sugarOptions"></div>
        </div>
        <div class="option-group" id="iceGroup">
          <label>冰量（冷飲 660ml）</label>
          <div class="option-row" id="iceOptions"></div>
        </div>
        <div class="option-group" id="peppercornGroup" style="display:none">
          <label>麻度</label>
          <div class="option-row" id="peppercornOptions"></div>
        </div>
        <div class="option-group" id="addAcidGroup" style="display:none">
          <label>加酸</label>
          <div class="option-row" id="addAcidOptions"></div>
        </div>
        <div class="option-group" id="thickenTeaGroup" style="display:none">
          <label>茶加厚</label>
          <div class="option-row" id="thickenTeaOptions"></div>
        </div>
        <div class="option-group" id="noCaffGroup" style="display:none">
          <label>咖啡因客製</label>
          <div class="option-row" id="noCaffOptions"></div>
        </div>
        <div class="option-group" id="hotGroup" style="display:none">
          <label>溫度客製</label>
          <div class="option-row" id="hotOptions"></div>
        </div>
        <div class="option-group">
          <label>加好料 <small>（可複選）</small></label>
          <div class="option-row" id="toppingOptions"></div>
        </div>
        <div class="fixed-note" id="hotPowderNote" style="display:none;border-color:#b45309;color:#b45309">
          注意：粉粿遇熱會融化，請確認是否仍要加料
        </div>
        <div class="qty-group">
          <button class="qty-btn" id="qtyMinus">－</button>
          <span id="qtyDisplay">1</span>
          <button class="qty-btn" id="qtyPlus">＋</button>
        </div>
      </div>
      <div class="modal-footer">
        <div class="modal-footer-left">
          <span id="modalTotalPrice" class="modal-total"></span>
          <span id="modalKcalEst" class="modal-kcal-est"></span>
        </div>
        <button class="add-btn" id="addToCartBtn">加入購物車</button>
      </div>
    </div>
  </div>

  <!-- 送出成功 Modal -->
  <div class="modal" id="successModal">
    <div class="modal-card success-card">
      <div class="success-icon">已送</div>
      <h3>訂單已送出</h3>
      <p class="success-name" id="successName"></p>
      <div class="success-items" id="successItems"></div>
      <p class="success-sub">等大家都點完<br>請按「眾」匯總後傳到 LINE</p>
      <button class="add-btn" id="closeSuccess" style="margin-top:16px;width:100%">繼續點餐</button>
    </div>
  </div>

  <!-- 歷史訂單 Modal -->
  <div class="modal" id="historyModal">
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <div class="modal-header-en">· recent orders ·</div>
          <h3>茶單史</h3>
        </div>
        <button class="close-btn" id="closeHistory">✕</button>
      </div>
      <div class="modal-body" id="historyBody"></div>
    </div>
  </div>

  <!-- 眾人茶單 Modal -->
  <div class="modal" id="groupModal">
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <div class="modal-header-en">· group orders ·</div>
          <h3>眾人茶單</h3>
        </div>
        <button class="close-btn" id="closeGroup">✕</button>
      </div>
      <div class="group-subtitle-row">
        <input type="text" id="groupSubtitle" class="group-subtitle-input" placeholder="# 輸入群組備注，如截單時間" maxlength="30" />
      </div>
      <div class="modal-body" id="groupBody">
        <p style="text-align:center;color:#8f7d5f;padding:20px"></p>
      </div>
      <div class="modal-footer group-modal-footer" id="groupFooter" style="display:none">
        <div class="group-footer-left">
          <div class="group-footer-label">grand total</div>
          <div class="group-footer-total" id="groupFooterTotal">NT$ 0</div>
        </div>
        <button class="group-send-btn" id="sendGroupBtn">複製清單給店家 →</button>
      </div>
    </div>
  </div>

  <!-- 複製匯總 Modal -->
  <div class="modal" id="copyModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>匯總文字</h3>
        <button class="close-btn" id="closeCopyModal">✕</button>
      </div>
      <div class="modal-body">
        <textarea id="copyText" readonly style="width:100%;height:200px;font-size:13px;line-height:1.6;border:1px solid var(--rule);padding:10px;resize:none;font-family:inherit;box-sizing:border-box;background:var(--paper-2);color:var(--ink);"></textarea>
      </div>
      <div class="modal-footer">
        <button class="add-btn" id="doCopyBtn" style="width:100%">複製 → 貼給店家</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="app.js?v=16"></script>
</body>
</html>
